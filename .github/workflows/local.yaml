---
name: Local Collect
on:
  push:
    paths:
      - .github/workflows/local.yaml
      - subscribe/local-config.json
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
permissions:
  contents: write
env:
  TZ: Asia/Shanghai
  SUBSCRIBE_CONF: subscribe/local-config.json
  LOCAL_BASEDIR: ${{ github.workspace }}
  GH_TOKEN: ${{ github.token }}
  ENABLE_SPECIAL_PROTOCOLS: "true"
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"
      - name: Install
        run: pip3 install -r requirements.txt
      - name: Process
        run: python -u subscribe/process.py --overwrite
      - name: Commit subs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subs/ || true
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: update subs [skip ci]"
          git push || echo "push finished"
      - name: Timestamp
        run: date
